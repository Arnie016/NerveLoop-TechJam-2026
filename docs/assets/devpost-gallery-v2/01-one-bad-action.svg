<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200">
  <defs>
    <linearGradient id="veil" x1="0" x2="1"><stop stop-color="#05080d" stop-opacity=".97"/><stop offset=".62" stop-color="#07131c" stop-opacity=".82"/><stop offset="1" stop-color="#061016" stop-opacity=".60"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="25" flood-color="#000" flood-opacity=".34"/></filter>
  </defs>
  <image href="nerveloop-shader-background.png" width="1800" height="1200" preserveAspectRatio="xMidYMid slice"/>
  <rect width="1800" height="1200" fill="url(#veil)"/>
  <g font-family="Inter, SF Pro Display, Helvetica, Arial, sans-serif">
    <text x="112" y="118" fill="#61e6db" font-size="28" font-weight="700" letter-spacing="6">NERVELOOP · THE EFFECT FIREWALL</text>
    <text x="112" y="260" fill="#f5fbff" font-size="92" font-weight="690">One bad action should not</text>
    <text x="112" y="365" fill="#f5fbff" font-size="92" font-weight="690">kill a useful agent.</text>
    <text x="112" y="430" fill="#a9bac5" font-size="30">Keep the reasoning. Remove the unsafe effect. Continue from a safe state.</text>

    <g transform="translate(112 560)" filter="url(#shadow)">
      <rect width="1576" height="410" rx="34" fill="#0a1119" fill-opacity=".90" stroke="#263540"/>
      <g transform="translate(56 70)">
        <circle cx="72" cy="80" r="58" fill="#0e2930" stroke="#46d9cf" stroke-width="3"/>
        <path d="M45 80h54M72 53v54" stroke="#74f2e5" stroke-width="8" stroke-linecap="round"/>
        <text x="0" y="188" fill="#eef8fb" font-size="27" font-weight="650">Useful session</text>
        <text x="0" y="228" fill="#8ea3ae" font-size="22">context stays alive</text>
      </g>
      <path d="M280 150H430" stroke="#55707a" stroke-width="4" stroke-linecap="round"/>
      <path d="M410 130l28 20-28 20" fill="none" stroke="#55707a" stroke-width="4"/>

      <g transform="translate(456 48)">
        <rect width="380" height="240" rx="28" fill="#201217" stroke="#ff725f" stroke-width="2"/>
        <text x="32" y="62" fill="#ff8b79" font-size="24" font-weight="700" letter-spacing="2">PROPOSED EFFECT</text>
        <text x="32" y="124" fill="#fff4f1" font-size="34" font-weight="650">Delete protected data</text>
        <text x="32" y="177" fill="#d6a7a0" font-size="24">Capability mismatch</text>
        <text x="32" y="212" fill="#d6a7a0" font-size="24">Policy becomes stricter</text>
      </g>
      <path d="M862 150h132" stroke="#ff725f" stroke-width="4" stroke-linecap="round"/>
      <path d="M974 130l28 20-28 20" fill="none" stroke="#ff725f" stroke-width="4"/>

      <g transform="translate(1028 48)">
        <rect width="300" height="240" rx="28" fill="#09241f" stroke="#55e6b5" stroke-width="2"/>
        <text x="32" y="62" fill="#6bf2c3" font-size="24" font-weight="700" letter-spacing="2">HOST DECISION</text>
        <text x="32" y="130" fill="#f0fff9" font-size="45" font-weight="730">DENY</text>
        <text x="32" y="181" fill="#9bd7c4" font-size="24">before worker starts</text>
      </g>
      <g transform="translate(1380 80)">
        <circle cx="54" cy="54" r="52" fill="#0b2824" stroke="#55e6b5" stroke-width="3"/>
        <path d="M29 55l17 17 36-42" fill="none" stroke="#6bf2c3" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="-16" y="160" fill="#eefcf7" font-size="27" font-weight="650">Continue safely</text>
        <text x="-7" y="200" fill="#8eaea4" font-size="22">same session</text>
      </g>
    </g>
    <text x="112" y="1098" fill="#758994" font-size="24">A control plane for long-horizon autonomous engineering — not another coding-agent chat UI.</text>
  </g>
</svg>
