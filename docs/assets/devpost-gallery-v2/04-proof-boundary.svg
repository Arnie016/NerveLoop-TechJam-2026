<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200">
  <defs><linearGradient id="veil"><stop stop-color="#05080d" stop-opacity=".98"/><stop offset="1" stop-color="#07151d" stop-opacity=".69"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000" flood-opacity=".32"/></filter></defs>
  <image href="nerveloop-shader-background.png" width="1800" height="1200" preserveAspectRatio="xMidYMid slice"/>
  <rect width="1800" height="1200" fill="url(#veil)"/>
  <g font-family="Inter, SF Pro Display, Helvetica, Arial, sans-serif">
    <text x="112" y="118" fill="#61e6db" font-size="28" font-weight="700" letter-spacing="6">ENGINEERING HONESTY IS A FEATURE</text>
    <text x="112" y="250" fill="#f5fbff" font-size="86" font-weight="690">A sharp proof boundary.</text>
    <text x="112" y="338" fill="#a9bac5" font-size="30">What the demo establishes — and what still needs real-world validation.</text>
    <g transform="translate(112 455)" filter="url(#shadow)">
      <rect width="750" height="520" rx="38" fill="#081b18" fill-opacity=".94" stroke="#54e1b0" stroke-width="2"/>
      <circle cx="64" cy="65" r="27" fill="#15503e"/><path d="M51 65l10 10 20-25" fill="none" stroke="#72f2bf" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="112" y="76" fill="#83f0c5" font-size="28" font-weight="720" letter-spacing="2">PROVEN LOCALLY</text>
      <g fill="#eafaf3" font-size="31">
        <text x="58" y="165">• Unsafe effects denied before dispatch</text>
        <text x="58" y="235">• One-use capability admission</text>
        <text x="58" y="305">• Monotone policy escalation</text>
        <text x="58" y="375">• Bounded rollback + fail-closed hold</text>
        <text x="58" y="445">• Causal receipts + mutation tests</text>
      </g>
      <rect x="58" y="472" width="634" height="1" fill="#2c5c4b"/>
      <text x="58" y="505" fill="#8eb6a7" font-size="20">Deterministic fixture; reproducible from the submitted source.</text>

      <g transform="translate(826)">
        <rect width="750" height="520" rx="38" fill="#17151a" fill-opacity=".94" stroke="#a87b67"/>
        <circle cx="64" cy="65" r="27" fill="#4a3029"/><path d="M64 47v24M64 82v2" stroke="#ff9c82" stroke-width="6" stroke-linecap="round"/>
        <text x="112" y="76" fill="#ffad96" font-size="28" font-weight="720" letter-spacing="2">OPEN VALIDATION</text>
        <g fill="#f1e7e4" font-size="31">
          <text x="58" y="165">• Ark/model-backed autonomous run</text>
          <text x="58" y="235">• OS-level sandbox enforcement</text>
          <text x="58" y="305">• TikTok systems or data access</text>
          <text x="58" y="375">• Production performance at scale</text>
          <text x="58" y="445">• Independent security evaluation</text>
        </g>
        <rect x="58" y="472" width="634" height="1" fill="#5e4037"/>
        <text x="58" y="505" fill="#b59a92" font-size="20">No claim crosses this boundary without new evidence.</text>
      </g>
    </g>
    <text x="112" y="1070" fill="#e8f3f6" font-size="31" font-weight="620">Why it can win: useful autonomy, controlled effects, and evidence judges can trust.</text>
  </g>
</svg>
