<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200">
  <defs><linearGradient id="veil"><stop stop-color="#05080d" stop-opacity=".98"/><stop offset="1" stop-color="#07151d" stop-opacity=".70"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000" flood-opacity=".32"/></filter></defs>
  <image href="nerveloop-shader-background.png" width="1800" height="1200" preserveAspectRatio="xMidYMid slice"/>
  <rect width="1800" height="1200" fill="url(#veil)"/>
  <g font-family="Inter, SF Pro Display, Helvetica, Arial, sans-serif">
    <text x="112" y="118" fill="#61e6db" font-size="28" font-weight="700" letter-spacing="6">THE MEASURED WIN</text>
    <text x="112" y="250" fill="#f5fbff" font-size="86" font-weight="690">We test the control plane,</text>
    <text x="112" y="346" fill="#f5fbff" font-size="86" font-weight="690">not the marketing claim.</text>
    <text x="112" y="414" fill="#a9bac5" font-size="30">Deterministic local fixture · causal receipts · failure injection</text>
    <g transform="translate(112 530)" filter="url(#shadow)">
      <g><rect width="360" height="350" rx="34" fill="#0a181c" stroke="#45d6ca"/><text x="34" y="70" fill="#75ece2" font-size="23" font-weight="700" letter-spacing="2">RECOVERY SCOPE</text><text x="34" y="178" fill="#f3fffd" font-size="58" font-weight="740">32 → 0 → 1</text><text x="34" y="232" fill="#a4c0bd" font-size="24">logical target paths</text><text x="34" y="292" fill="#d3e6e4" font-size="22">Baseline · denied effect ·</text><text x="34" y="324" fill="#d3e6e4" font-size="22">one exact recovery target</text></g>
      <g transform="translate(400)"><rect width="360" height="350" rx="34" fill="#10161d" stroke="#ff7d69"/><text x="34" y="70" fill="#ff947f" font-size="23" font-weight="700" letter-spacing="2">ADMISSION GATE</text><text x="34" y="178" fill="#fff7f5" font-size="72" font-weight="740">28 denied</text><text x="34" y="232" fill="#d4ada7" font-size="24">unsafe admissions</text><text x="34" y="292" fill="#efe0dc" font-size="22">0 worker dispatches</text><text x="34" y="324" fill="#efe0dc" font-size="22">after denial</text></g>
      <g transform="translate(800)"><rect width="360" height="350" rx="34" fill="#0c1818" stroke="#65dfad"/><text x="34" y="70" fill="#7bf0bd" font-size="23" font-weight="700" letter-spacing="2">DRIFT + RESTORE</text><text x="34" y="178" fill="#f3fff9" font-size="72" font-weight="740">36 / 36</text><text x="34" y="232" fill="#acd0c0" font-size="24">scenarios passed</text><text x="34" y="292" fill="#dcece5" font-size="22">Detection and bounded</text><text x="34" y="324" fill="#dcece5" font-size="22">restoration exercised</text></g>
      <g transform="translate(1200)"><rect width="376" height="350" rx="34" fill="#17150e" stroke="#e3b754"/><text x="34" y="70" fill="#f2ca70" font-size="23" font-weight="700" letter-spacing="2">MUTATION TEST</text><text x="34" y="178" fill="#fffaf0" font-size="72" font-weight="740">20 / 20</text><text x="34" y="232" fill="#cdbf9e" font-size="24">mutants killed</text><text x="34" y="292" fill="#e9e1cd" font-size="22">Tests fail when safety</text><text x="34" y="324" fill="#e9e1cd" font-size="22">logic is deliberately broken</text></g>
    </g>
    <text x="112" y="968" fill="#89a0aa" font-size="24">These are local deterministic fixture results. Path counts are scope, not speed.</text>
    <text x="112" y="1055" fill="#e7f3f6" font-size="31" font-weight="620">The differentiator: a reproducible systems argument a judge can falsify.</text>
  </g>
</svg>
