<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">NerveLoop runtime boundary truth map</title>
  <desc id="desc">A one-page architecture diagram separating the verified deterministic fixture lane from the wired but not provider-proven Codex and Ark runtime lane.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071014"/>
      <stop offset="0.58" stop-color="#0a1116"/>
      <stop offset="1" stop-color="#111017"/>
    </linearGradient>
    <linearGradient id="fixturePanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1b1f"/>
      <stop offset="1" stop-color="#0a1418"/>
    </linearGradient>
    <linearGradient id="runtimePanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15161c"/>
      <stop offset="1" stop-color="#111218"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity="0.025" stroke-width="1"/>
    </pattern>
    <marker id="arrowCyan" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#42e8df"/>
    </marker>
    <marker id="arrowAmber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#f2b94b"/>
    </marker>
    <style>
      .sans { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: "SFMono-Regular", Menlo, Monaco, Consolas, monospace; }
      .eyebrow { font-size: 17px; font-weight: 700; letter-spacing: 3.6px; }
      .panel-title { font-size: 29px; font-weight: 760; letter-spacing: -0.3px; }
      .panel-kicker { font-size: 14px; font-weight: 700; letter-spacing: 2.4px; }
      .node-title { font-size: 18px; font-weight: 740; }
      .node-copy { font-size: 14px; font-weight: 520; }
      .tiny { font-size: 12px; font-weight: 650; letter-spacing: 1px; }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="url(#background)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>
  <circle cx="1560" cy="-80" r="520" fill="#ff4d67" opacity="0.025"/>
  <circle cx="270" cy="960" r="460" fill="#31dfd7" opacity="0.035"/>

  <g class="sans">
    <g transform="translate(66 48)">
      <rect x="0" y="4" width="5" height="20" rx="2" fill="#42e8df"/>
      <rect x="10" y="0" width="5" height="24" rx="2" fill="#f4f7f7"/>
      <rect x="20" y="8" width="5" height="16" rx="2" fill="#ff5c6b"/>
      <text x="43" y="20" class="mono eyebrow" fill="#b7c1c6">TIKTOK TECHJAM 2026  /  TRACK #1  /  AGENT LAUNCHPAD</text>
      <text x="1788" y="20" text-anchor="end" class="mono eyebrow" fill="#58666e">NERVELOOP  /  RUNTIME TRUTH MAP</text>
    </g>
    <line x1="66" y1="88" x2="1854" y2="88" stroke="#304048" stroke-width="1"/>

    <text x="66" y="142" class="mono eyebrow" fill="#42e8df">ONE PAGE. TWO LANES. NO BORROWED PROOF.</text>
    <text x="66" y="204" font-size="50" font-weight="780" letter-spacing="-1.6" fill="#f5f7f7">Where NerveLoop actually enforces authority</text>
    <text x="66" y="240" font-size="19" font-weight="500" fill="#95a5ac">Verified fixture evidence stays separate from the wired real-runtime path and its open live gate.</text>

    <!-- Shared host control-plane seam -->
    <g transform="translate(66 276)">
      <rect width="1788" height="82" rx="16" fill="#0d171b" stroke="#4d646d"/>
      <rect width="8" height="82" rx="4" fill="#dbe5e8"/>
      <text x="34" y="33" class="mono panel-kicker" fill="#91a1a8">TRUSTED HOST CONTROL PLANE</text>
      <text x="34" y="61" class="sans node-title" fill="#f3f6f7">Browser Playground  ->  AgentService admission  ->  durable Run receipt  ->  judge-visible state</text>
      <g transform="translate(1392 17)">
        <rect width="356" height="48" rx="12" fill="#111f24" stroke="#3d5963"/>
        <text x="178" y="20" text-anchor="middle" class="mono tiny" fill="#94a7ae">SHARED INVARIANT</text>
        <text x="178" y="38" text-anchor="middle" class="sans node-copy" fill="#e3e8ea">No result publishes before RunGuard settles</text>
      </g>
    </g>

    <!-- Lane panels -->
    <g transform="translate(66 386)">
      <rect width="868" height="514" rx="20" fill="url(#fixturePanel)" stroke="#2f817f" stroke-width="1.5"/>
      <rect x="884" width="904" height="514" rx="20" fill="url(#runtimePanel)" stroke="#8b7040" stroke-width="1.5" stroke-dasharray="9 8"/>

      <!-- Fixture lane -->
      <g transform="translate(30 27)">
        <rect width="156" height="30" rx="15" fill="#123a3c" stroke="#42e8df"/>
        <circle cx="18" cy="15" r="5" fill="#42e8df" filter="url(#softGlow)"/>
        <text x="34" y="20" class="mono tiny" fill="#a9faf4">LOCALLY VERIFIED</text>
        <text x="0" y="72" class="sans panel-title" fill="#f4f7f7">A  /  Deterministic fixture lane</text>
        <text x="0" y="98" class="mono panel-kicker" fill="#58cbc7">DEMO_RUNNER=1  /  NO MODEL OR PROVIDER CALL</text>

        <!-- Fixture nodes -->
        <g transform="translate(0 132)">
          <rect width="184" height="94" rx="14" fill="#0d2024" stroke="#3aa8a4"/>
          <text x="20" y="30" class="mono tiny" fill="#6cebe4">01  PROPOSAL</text>
          <text x="20" y="57" class="sans node-title" fill="#eff5f5">Exact typed effect</text>
          <text x="20" y="78" class="mono node-copy" fill="#829aa1">delete / protected</text>

          <line x1="184" y1="47" x2="224" y2="47" stroke="#42e8df" stroke-width="2" marker-end="url(#arrowCyan)"/>

          <rect x="230" width="184" height="94" rx="14" fill="#102326" stroke="#ff6270" stroke-width="1.5"/>
          <text x="250" y="30" class="mono tiny" fill="#ff7b86">02  HOST GATE</text>
          <text x="250" y="57" class="sans node-title" fill="#eff5f5">Effect Firewall</text>
          <text x="250" y="78" class="mono node-copy" fill="#a3afb3">operation x target</text>

          <path d="M414 47H455V-8H500" fill="none" stroke="#ff6270" stroke-width="2" marker-end="url(#arrowCyan)"/>
          <rect x="500" y="-42" width="290" height="68" rx="12" fill="#251318" stroke="#ff6270"/>
          <text x="520" y="-15" class="mono tiny" fill="#ff8790">BLOCKED BEFORE DISPATCH</text>
          <text x="520" y="8" class="sans node-copy" fill="#f2dce0">worker 0  /  before = after</text>

          <line x1="414" y1="68" x2="454" y2="68" stroke="#42e8df" stroke-width="2" marker-end="url(#arrowCyan)"/>
          <rect x="460" y="42" width="330" height="94" rx="14" fill="#10231f" stroke="#55d59b"/>
          <text x="480" y="72" class="mono tiny" fill="#6be0a8">ALLOWED EXACT EFFECT</text>
          <text x="480" y="99" class="sans node-title" fill="#eff5f5">One-use grant -> sink</text>
          <text x="480" y="121" class="mono node-copy" fill="#8ba69d">exact path + payload -> commit</text>
        </g>

        <g transform="translate(0 300)">
          <rect width="790" height="126" rx="15" fill="#0a171a" stroke="#28545a"/>
          <text x="22" y="30" class="mono tiny" fill="#7e989f">RECEIPT-DRIVEN RESULT</text>
          <g transform="translate(22 48)">
            <circle cx="10" cy="10" r="9" fill="#42e8df"/>
            <text x="10" y="14" text-anchor="middle" font-size="12" font-weight="800" fill="#081114">1</text>
            <text x="30" y="15" class="sans node-copy" fill="#dce7e8">normal safe write committed</text>
            <circle cx="282" cy="10" r="9" fill="#ff6270"/>
            <text x="282" y="14" text-anchor="middle" font-size="12" font-weight="800" fill="#16090b">2</text>
            <text x="302" y="15" class="sans node-copy" fill="#dce7e8">protected effect denied</text>
            <circle cx="552" cy="10" r="9" fill="#55d59b"/>
            <text x="552" y="14" text-anchor="middle" font-size="12" font-weight="800" fill="#07150f">3</text>
            <text x="572" y="15" class="sans node-copy" fill="#dce7e8">later safe retained</text>
          </g>
          <text x="22" y="95" class="mono node-copy" fill="#68d8d3">PROVES: typed fixture decision, exact sink, unchanged denial, same-Agent continuation</text>
          <text x="22" y="116" class="mono node-copy" fill="#66777e">DOES NOT PROVE: semantic intent detection, Ark behavior, hostile-process confinement</text>
        </g>
      </g>

      <!-- Real runtime lane -->
      <g transform="translate(914 27)">
        <rect width="224" height="30" rx="15" fill="#332816" stroke="#f2b94b"/>
        <circle cx="18" cy="15" r="5" fill="#f2b94b" filter="url(#softGlow)"/>
        <text x="34" y="20" class="mono tiny" fill="#ffe1a0">WIRED  /  LIVE GATE OPEN</text>
        <text x="0" y="72" class="sans panel-title" fill="#f4f7f7">B  /  Non-demo runtime lane</text>
        <text x="0" y="98" class="mono panel-kicker" fill="#dfad50">DEMO_RUNNER=0  /  CODEX CLI + ARK ADMISSION</text>

        <g transform="translate(0 132)">
          <rect width="190" height="94" rx="14" fill="#171a1f" stroke="#8c7a56"/>
          <text x="18" y="29" class="mono tiny" fill="#d9b86f">01  BEFORE RUN</text>
          <text x="18" y="56" class="sans node-title" fill="#eff2f3">RunGuard prepare</text>
          <text x="18" y="78" class="mono node-copy" fill="#89969c">bounded checkpoint</text>

          <line x1="190" y1="47" x2="224" y2="47" stroke="#f2b94b" stroke-width="2" marker-end="url(#arrowAmber)"/>

          <rect x="230" width="205" height="94" rx="14" fill="#171a1f" stroke="#8c7a56"/>
          <text x="248" y="29" class="mono tiny" fill="#d9b86f">02  OWNED PROCESS</text>
          <text x="248" y="56" class="sans node-title" fill="#eff2f3">Supervisor + timeout</text>
          <text x="248" y="78" class="mono node-copy" fill="#89969c">cleanup path implemented</text>

          <line x1="435" y1="47" x2="469" y2="47" stroke="#f2b94b" stroke-width="2" marker-end="url(#arrowAmber)"/>

          <rect x="475" width="205" height="94" rx="14" fill="#201d1c" stroke="#ff786c" stroke-dasharray="7 5"/>
          <text x="493" y="29" class="mono tiny" fill="#ff958a">03  OPEN PROOF</text>
          <text x="493" y="56" class="sans node-title" fill="#eff2f3">Codex CLI + Ark</text>
          <text x="493" y="78" class="mono node-copy" fill="#b59c99">not run in flagship</text>

          <line x1="680" y1="47" x2="714" y2="47" stroke="#f2b94b" stroke-width="2" marker-end="url(#arrowAmber)"/>

          <rect x="720" width="140" height="94" rx="14" fill="#171a1f" stroke="#8c7a56"/>
          <text x="738" y="29" class="mono tiny" fill="#d9b86f">04  AFTER</text>
          <text x="738" y="56" class="sans node-title" fill="#eff2f3">Verify</text>
          <text x="738" y="78" class="mono node-copy" fill="#89969c">retain / restore</text>
        </g>

        <g transform="translate(0 252)">
          <rect width="860" height="64" rx="13" fill="#19191c" stroke="#645944"/>
          <text x="20" y="25" class="mono tiny" fill="#d3b26c">PROTECTED ASSET</text>
          <text x="20" y="48" class="sans node-copy" fill="#e5e7e8">Mock workspace secret: <tspan class="mono" fill="#ff9a91">.env</tspan>  /  protected database equivalent</text>
          <path d="M630 32H820" stroke="#ff786c" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowAmber)"/>
        </g>

        <g transform="translate(0 336)">
          <rect width="860" height="110" rx="15" fill="#12171a" stroke="#53636b"/>
          <text x="20" y="28" class="mono tiny" fill="#9aabb2">JUDGE-VISIBLE TERMINAL STATE</text>
          <g transform="translate(20 45)">
            <rect width="158" height="42" rx="10" fill="#29161b" stroke="#ff6270"/>
            <text x="79" y="26" text-anchor="middle" class="mono tiny" fill="#ff8f98">BLOCKED / DENIED</text>
            <path d="M158 21H196" stroke="#84939a" marker-end="url(#arrowAmber)"/>
            <rect x="202" width="166" height="42" rx="10" fill="#211d16" stroke="#f2b94b"/>
            <text x="285" y="26" text-anchor="middle" class="mono tiny" fill="#f7cc78">OUTPUT WITHHELD</text>
            <path d="M368 21H406" stroke="#84939a" marker-end="url(#arrowAmber)"/>
            <rect x="412" width="176" height="42" rx="10" fill="#14241e" stroke="#55d59b"/>
            <text x="500" y="26" text-anchor="middle" class="mono tiny" fill="#7be3b2">CLEANED / RESTORED</text>
            <path d="M588 21H626" stroke="#84939a" marker-end="url(#arrowAmber)"/>
            <rect x="632" width="188" height="42" rx="10" fill="#142426" stroke="#42e8df"/>
            <text x="726" y="26" text-anchor="middle" class="mono tiny" fill="#7cf1eb">SAME AGENT READY</text>
          </g>
        </g>
      </g>
    </g>

    <!-- Open acceptance gate -->
    <g transform="translate(66 924)">
      <rect width="1788" height="104" rx="18" fill="#1c1316" stroke="#ff6270" stroke-width="1.5"/>
      <rect width="10" height="104" rx="5" fill="#ff6270"/>
      <g transform="translate(34 22)">
        <text x="0" y="20" class="mono panel-kicker" fill="#ff8791">OPEN ACCEPTANCE GATE  /  DO NOT PRESENT AS PROVED</text>
        <text x="0" y="54" class="sans panel-title" fill="#f6eef0">Ark/model-backed live Agent Run + observed worker termination</text>
      </g>
      <g transform="translate(1192 18)">
        <rect width="556" height="68" rx="13" fill="#28191d" stroke="#7f3740"/>
        <text x="278" y="27" text-anchor="middle" class="mono tiny" fill="#ff9da5">CURRENT FLAGSHIP STATUS</text>
        <text x="278" y="51" text-anchor="middle" class="sans node-title" fill="#f7e8eb">NOT EXECUTED  /  NOT DEMONSTRATED</text>
      </g>
    </g>

    <text x="66" y="1062" class="mono tiny" fill="#697a82">SOLID CYAN = VERIFIED FIXTURE  /  SOLID NEUTRAL = IMPLEMENTED HOST CONTROL  /  DASHED AMBER = WIRED PATH WITH OPEN LIVE PROOF</text>
    <text x="1854" y="1062" text-anchor="end" class="mono tiny" fill="#697a82">LOCAL EVIDENCE ONLY  /  NO TIKTOK OR PRODUCTION CLAIM</text>
  </g>
</svg>
