name: Verify NerveLoop

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  public-source:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify the declared public-source boundary
        run: npm run submission:source-check
      - name: Typecheck
        run: npm run typecheck
      - name: Build the web and server packages
        run: npm run build
      - name: Exercise public-safe containment and measurement suites
        run: >-
          node --test
          scripts/effect-firewall-adversarial-matrix.test.mjs
          scripts/effect-sink-redemption-lab.test.mjs
          scripts/track-c-condition-benchmark.test.mjs
